[package]
name = "bayzip"
version = "2.0.7"
description = "Bayzip - High-Performance Hardware-Accelerated Archiver"
authors = ["Muhammad Ali (Baymax)"]
edition = "2021"

[workspace]
members = [
    ".",
    "crates/bayzip_shell",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bayzip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
zstd = { version = "0.13", features = ["zstdmt"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
zip = { version = "2.1", default-features = false, features = ["deflate", "bzip2", "aes-crypto"] }
tar = "0.4"
flate2 = "1.0"
sevenz-rust2 = { version = "0.23.0", features = ["compress", "aes256"] }
brotli = "9.0"
lz4_flex = "0.11"


[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
